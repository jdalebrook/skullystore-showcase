# nginx site config para store.bskully.es -- copiar a
# /etc/nginx/sites-available/store.bskully.es en la VPS y enlazar en
# sites-enabled. Sigue el mismo patrón que bskully.es y survivors.bskully.es.

# Límite de peticiones por IP para frenar crawling agresivo/scraping y
# reducir superficie de ataque (mismo criterio que el rate limit ya
# existente a nivel de aplicación en login/checkout, ver AGENTS.md ->
# Seguridad, aquí aplicado a nivel de servidor web para todo el tráfico).
# Esta directiva vive fuera de cualquier `server {}` a propósito: el
# `include` de este archivo ocurre dentro del bloque `http {}` de
# nginx.conf, que es el único contexto donde `limit_req_zone` es válido.
limit_req_zone $binary_remote_addr zone=store_general:10m rate=10r/s;

server {
    listen 80;
    server_name store.bskully.es;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name store.bskully.es;

    ssl_certificate     /etc/letsencrypt/live/bskully.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bskully.es/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # nginx limita el cuerpo de la petición a 1MB por defecto -- las fotos
    # de producto subidas desde el admin pueden superarlo fácilmente antes
    # de comprimirse (el límite de la app es 5MB por archivo).
    client_max_body_size 10M;

    location / {
        # `burst=20 nodelay` absorbe picos normales de un visitante real
        # (varias imágenes/rutas cargando a la vez) sin cortarle; lo que
        # frena es una IP sostenida muy por encima de eso.
        limit_req        zone=store_general burst=20 nodelay;
        limit_req_status  429;

        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_read_timeout  60s;
    }
}
